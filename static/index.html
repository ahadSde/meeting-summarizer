<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Meeting Summarizer</title>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-4xl px-6 py-16">
      <header class="mb-10"><p class="mb-2 text-sm font-semibold uppercase tracking-[.2em] text-cyan-400">AI meeting intelligence</p><h1 class="text-4xl font-bold tracking-tight">Meeting Summarizer</h1><p class="mt-3 text-slate-400">Upload audio to get a grounded transcript, decisions, and action items.</p></header>
      <section class="rounded-2xl border border-slate-700 bg-slate-900 p-6 shadow-xl">
        <form id="upload-form" class="flex flex-col gap-4 sm:flex-row sm:items-center"><input id="audio" name="audio" type="file" accept="audio/*,.m4a,.webm" required class="block w-full text-sm text-slate-300 file:mr-4 file:rounded-lg file:border-0 file:bg-cyan-400 file:px-4 file:py-2 file:font-semibold file:text-slate-950 hover:file:bg-cyan-300" /><button class="rounded-lg bg-cyan-400 px-5 py-2.5 font-semibold text-slate-950 hover:bg-cyan-300 disabled:opacity-50">Summarize</button></form>
        <p id="status" class="mt-4 hidden text-sm text-slate-300"></p>
      </section>
      <section id="results" class="mt-8 hidden space-y-6"></section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
